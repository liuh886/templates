name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: JavaScript syntax
        run: node --check app.js
      - name: Required product contract
        run: test -s PRODUCT.md && test -s index.html && test -s styles.css
